<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#03040a" />
<title>星引力 · 3D 手势星空</title>
<style>
:root{color-scheme:dark;--bg:#03040a;--ink:#edf3ff;--muted:#8590a6;--cyan:#74e8ff;--violet:#a78bfa;--line:#a9c8ff22}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}#space{position:fixed;inset:0;z-index:0}#space canvas{display:block;width:100%;height:100%}.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 30%,#03040a55 72%,#03040add 110%)}header{position:fixed;z-index:3;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:26px 34px;pointer-events:none}.brand{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:#dfe9ff}.brand b{color:var(--cyan);font-weight:600}.status-top{display:flex;gap:10px;align-items:center;font:10px ui-monospace,Consolas,monospace;letter-spacing:.12em;color:#aab7cf}.dot{width:7px;height:7px;border-radius:50%;background:#69738a;box-shadow:0 0 10px currentColor}.dot.live{background:#69f0c4;color:#69f0c4;animation:blink 1.3s infinite}@keyframes blink{50%{opacity:.35}}.hero{position:fixed;z-index:2;left:50%;top:19%;transform:translateX(-50%);text-align:center;pointer-events:none;width:min(760px,90vw)}.eyebrow{font:10px ui-monospace,Consolas,monospace;color:#8fa1c1;letter-spacing:.34em;text-transform:uppercase}h1{font-size:clamp(34px,6vw,76px);line-height:.98;letter-spacing:-.06em;font-weight:500;margin:16px 0 12px;text-shadow:0 0 35px #97aaff2b}h1 span{background:linear-gradient(100deg,#f2f5ff 10%,#a7deff 48%,#b3a2ff 90%);background-clip:text;color:transparent}.sub{font-size:13px;color:#96a2b8;letter-spacing:.06em}.mode-card{position:fixed;z-index:3;left:50%;bottom:13%;transform:translateX(-50%);text-align:center;min-width:250px;pointer-events:none}.mode-label{font:11px ui-monospace,Consolas,monospace;letter-spacing:.2em;color:var(--cyan);text-transform:uppercase}.mode-hint{margin-top:8px;font-size:12px;color:#8894ab}.controls{position:fixed;z-index:4;right:30px;bottom:30px;display:flex;gap:9px;align-items:center}.btn{border:1px solid #a8c7f52c;background:#0b1020ba;color:#dce8ff;border-radius:999px;padding:11px 16px;font:11px ui-monospace,Consolas,monospace;letter-spacing:.06em;cursor:pointer;backdrop-filter:blur(14px);transition:.2s}.btn:hover{border-color:#8beaff99;box-shadow:0 0 24px #78e9ff22}.btn.primary{border-color:#7ce8ff80;background:#102331d9;color:#a6f0ff}.btn:disabled{opacity:.5;cursor:wait}.camera-box{position:fixed;z-index:4;left:24px;bottom:24px;width:220px;padding:7px;border:1px solid #9cdfff35;border-radius:13px;background:#09101cbf;box-shadow:0 12px 45px #0008;backdrop-filter:blur(12px);opacity:.88;transition:.25s}.camera-box:hover{opacity:1}.camera-title{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 7px;font:9px ui-monospace,Consolas,monospace;letter-spacing:.13em;color:#9fb0c9}.cam-indicator{color:#79869d}.cam-indicator.on{color:#70f0c6}.cam-wrap{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;border-radius:8px;background:radial-gradient(ellipse,#101d30,#05070d)}#video{display:block;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;transition:opacity .3s}#video.ready{opacity:.85}#hand-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transform:scaleX(-1)}.camera-caption{margin:7px 2px 2px;color:#73819a;font-size:9px;line-height:1.45}.toast{position:fixed;z-index:5;left:50%;top:26px;transform:translate(-50%,-12px);padding:11px 15px;border-radius:9px;background:#151a28f2;border:1px solid #ff879055;color:#ffc0c0;font-size:12px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.corner{position:fixed;z-index:2;bottom:32px;left:270px;font:9px ui-monospace,Consolas,monospace;letter-spacing:.16em;color:#60708a88}.key{display:inline-block;border:1px solid #7183a344;border-radius:4px;padding:2px 5px;color:#9aa9c2;margin:0 3px}@media(max-width:650px){header{padding:19px 18px}.hero{top:17%}.sub{font-size:11px;padding:0 15px}.camera-box{left:13px;bottom:13px;width:158px}.controls{right:13px;bottom:13px;gap:6px}.btn{padding:10px 12px;font-size:9px}.corner{display:none}.mode-card{bottom:17%}}
</style>
</head>
<body>
<div id="space" aria-hidden="true"></div><div class="vignette"></div>
<header><div class="brand"><b>✦</b> COSMIC / GESTURE</div><div class="status-top"><i class="dot" id="liveDot"></i><span id="topStatus">SYSTEM STANDBY</span></div></header>
<section class="hero"><div class="eyebrow">A SMALL UNIVERSE IN YOUR HAND</div><h1><span>星引力</span></h1><div class="sub">张开手，星河迸发；握紧拳，万物坍缩成心跳。</div></section>
<div class="mode-card"><div class="mode-label" id="modeLabel">银河旋涡 · GALAXY</div><div class="mode-hint" id="modeHint">移动鼠标探索，或开启摄像头用手势改变星云</div></div>
<div class="camera-box"><div class="camera-title"><span>LIVE HAND TRACKING</span><span id="camIndicator" class="cam-indicator">OFFLINE</span></div><div class="cam-wrap"><video id="video" playsinline muted></video><canvas id="hand-overlay"></canvas></div><div class="camera-caption" id="camCaption">画面仅在本机处理，不会上传</div></div>
<div class="corner"><span class="key">F</span> 模拟握拳 <span class="key">O</span> 模拟张掌 <span class="key">G</span> 返回银河</div>
<div class="controls"><button class="btn" id="mouseBtn" title="用鼠标模拟张开的手掌">鼠标互动</button><button class="btn primary" id="cameraBtn" disabled>正在加载…</button></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const THREE_URL='https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js';
const HANDS_URL='https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js';
const HANDS_CDN='https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/';
const COUNT=30000,TAU=Math.PI*2;
let scene,camera,renderer,points,geometry,positions,velocities,accelerations,base,heart,colors,material;
let mode='galaxy',handMode='none',handPoint={x:.5,y:.5},mousePoint={x:.5,y:.5},handLandmarks=null,mpHands=null,cameraStream=null,detectionBusy=false,animationId=0,clock;
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function sayError(message){const toast=$('toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),4200)}
function setMode(next){if(mode===next)return;mode=next;const label=$('modeLabel'),hint=$('modeHint');if(next==='blackhole'){label.textContent='黑洞引力 · HEART COLLAPSE';label.style.color='#ff8fc9';hint.textContent='拳头已锁定：星尘正坍缩为一颗心';}else if(next==='explosion'){label.textContent='大爆炸 · NOVA REPULSION';label.style.color='#8beaff';hint.textContent='张开手掌：掌心附近的星尘被强力推开';}else{label.textContent='银河旋涡 · GALAXY';label.style.color='';hint.textContent='移动鼠标探索，或开启摄像头用手势改变星云';}}
function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=resolve;s.onerror=()=>reject(new Error('脚本加载失败：'+src));document.head.appendChild(s)})}
function randomNormal(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v)}
function heartPoint(t,scale,depth){const x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);const fill=Math.sqrt(Math.random());return [x*scale*fill,(y-1.5)*scale*fill,randomNormal()*depth]}
function initThree(){scene=new THREE.Scene();scene.background=new THREE.Color(0x03040a);camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,160);camera.position.set(0,0,27);renderer=new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;$('space').appendChild(renderer.domElement);geometry=new THREE.BufferGeometry();positions=new Float32Array(COUNT*3);velocities=new Float32Array(COUNT*3);accelerations=new Float32Array(COUNT*3);base=new Float32Array(COUNT*3);heart=new Float32Array(COUNT*3);colors=new Float32Array(COUNT*3);const arms=4;for(let i=0;i<COUNT;i++){const k=i*3;const radius=Math.pow(Math.random(),.58)*13.8+.25;const arm=i%arms;const angle=arm*TAU/arms+radius*.48+(Math.random()-.5)*.58;const thickness=(Math.random()-.5)*(.18+radius*.035);base[k]=Math.cos(angle)*radius+Math.cos(angle+Math.PI/2)*thickness;base[k+1]=(Math.random()-.5)*(.42+radius*.035);base[k+2]=Math.sin(angle)*radius+Math.sin(angle+Math.PI/2)*thickness;positions[k]=base[k]+randomNormal()*.55;positions[k+1]=base[k+1]+randomNormal()*.55;positions[k+2]=base[k+2]+randomNormal()*.55;const hp=heartPoint(Math.random()*TAU,.48,.58);heart[k]=hp[0];heart[k+1]=hp[1];heart[k+2]=hp[2];const mix=clamp(radius/14,0,1);const c1=new THREE.Color(0x73dfff),c2=new THREE.Color(0xa88cff),c3=new THREE.Color(0xffc8f4);const c=c1.clone().lerp(c2,clamp(mix*.8,0,1)).lerp(c3,Math.random()*.22);colors[k]=c.r;colors[k+1]=c.g;colors[k+2]=c.b;}geometry.setAttribute('position',new THREE.BufferAttribute(positions,3).setUsage(THREE.DynamicDrawUsage));geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));const spriteCanvas=document.createElement('canvas');spriteCanvas.width=spriteCanvas.height=64;const g=spriteCanvas.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.13,'rgba(220,248,255,.95)');gr.addColorStop(.38,'rgba(140,210,255,.35)');gr.addColorStop(1,'rgba(80,140,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);const texture=new THREE.CanvasTexture(spriteCanvas);material=new THREE.PointsMaterial({size:.26,map:texture,vertexColors:true,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true});points=new THREE.Points(geometry,material);scene.add(points);clock=new THREE.Clock();window.addEventListener('resize',onResize);renderer.domElement.addEventListener('pointermove',onPointerMove);animate();}
function onResize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))}
function onPointerMove(e){mousePoint.x=e.clientX/innerWidth;mousePoint.y=e.clientY/innerHeight;if(!cameraStream&&$('mouseBtn').classList.contains('active')){handPoint={...mousePoint};handMode='open';setMode('explosion')}}
function animate(){animationId=requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.035),time=clock.elapsedTime;const p=positions,v=velocities,a=accelerations;const handX=(handPoint.x-.5)*24,handY=(.5-handPoint.y)*14;const repulseRadius=6.2;for(let i=0;i<COUNT;i++){const k=i*3,x=p[k],y=p[k+1],z=p[k+2];let ax=0,ay=0,az=0;if(mode==='blackhole'){const targetX=heart[k],targetY=heart[k+1],targetZ=heart[k+2];ax=(targetX-x)*5.2+(-y)*.42;ay=(targetY-y)*5.2+x*.42;az=(targetZ-z)*5.2;}else{const targetX=base[k],targetY=base[k+1],targetZ=base[k+2];const spring=mode==='explosion'?.7:1.35;ax=(targetX-x)*spring;ay=(targetY-y)*spring;az=(targetZ-z)*spring;const swirl=.16+Math.min(Math.hypot(x,y),14)*.012;ax+=-y*swirl;ay+=x*swirl;if(mode==='explosion'){const dx=x-handX,dy=y-handY,dz=z;const d2=dx*dx+dy*dy+dz*dz+.3;if(d2<repulseRadius*repulseRadius){const d=Math.sqrt(d2),force=34*Math.pow(1-d/repulseRadius,1.55)/(d+.45);ax+=(dx/d)*force;ay+=(dy/d)*force;az+=(dz/d)*force;}}}a[k]=ax;a[k+1]=ay;a[k+2]=az;const damping=Math.pow(mode==='blackhole'?.91:.955,dt*60);v[k]=(v[k]+a[k]*dt)*damping;v[k+1]=(v[k+1]+a[k+1]*dt)*damping;v[k+2]=(v[k+2]+a[k+2]*dt)*damping;const speed=Math.hypot(v[k],v[k+1],v[k+2]),max=mode==='blackhole'?12:18;if(speed>max){const s=max/speed;v[k]*=s;v[k+1]*=s;v[k+2]*=s}p[k]+=v[k]*dt;p[k+1]+=v[k+1]*dt;p[k+2]+=v[k+2]*dt;}geometry.attributes.position.needsUpdate=true;points.rotation.y+=dt*(mode==='blackhole'?.12:.025);points.rotation.z=Math.sin(time*.12)*.025;renderer.render(scene,camera)}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function classifyHand(lm){const wrist=lm[0],fingerPairs=[[8,6],[12,10],[16,14],[20,18]];let extended=0;for(const [tip,pip] of fingerPairs){if(distance(lm[tip],wrist)>distance(lm[pip],wrist)*1.12)extended++;}const thumbExtended=distance(lm[4],lm[5])>distance(lm[3],lm[5])*1.06;if(extended<=1&&!thumbExtended)return'fist';if(extended>=3)return'open';return'other'}
function drawHand(lm){const c=$('hand-overlay'),r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,r.width,r.height);if(!lm)return;const lines=[[0,1,2,3,4],[0,5,6,7,8],[5,9,10,11,12],[9,13,14,15,16],[13,17,18,19,20],[0,17]];x.lineWidth=2;x.strokeStyle='rgba(116,232,255,.88)';x.shadowColor='#74e8ff';x.shadowBlur=7;for(const line of lines){x.beginPath();line.forEach((idx,j)=>{const px=lm[idx].x*r.width,py=lm[idx].y*r.height;j?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}x.shadowBlur=0;lm.forEach((pt,i)=>{x.beginPath();x.arc(pt.x*r.width,pt.y*r.height,i%4===0?3.2:2,0,TAU);x.fillStyle=i===0?'#ff8fc9':'#dbfbff';x.fill()})}
function onHandResults(results){const lm=results.multiHandLandmarks?.[0];if(!lm){handLandmarks=null;handMode='none';drawHand(null);$('camCaption').textContent=cameraStream?'未检测到手，请将一只手放进画面':'画面仅在本机处理，不会上传';setMode('galaxy');return}handLandmarks=lm;handPoint={x:1-lm[9].x,y:lm[9].y};drawHand(lm);const gesture=classifyHand(lm);if(gesture==='fist'){handMode='fist';setMode('blackhole');$('camCaption').textContent='识别到握拳 · 黑洞引力模式'}else if(gesture==='open'){handMode='open';setMode('explosion');$('camCaption').textContent='识别到张掌 · 大爆炸排斥模式'}else{handMode='other';setMode('galaxy');$('camCaption').textContent='手已追踪 · 张开手掌或握拳切换效果'}}
async function startCamera(){const btn=$('cameraBtn');btn.disabled=true;btn.textContent='加载手势识别…';try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('当前浏览器不支持摄像头，请用 Chrome/Edge 在 HTTPS 或 localhost 页面打开。');if(!window.THREE)throw new Error('Three.js 尚未加载完成，请检查网络后刷新。');$('topStatus').textContent='LOADING MEDIAPIPE';await loadScript(HANDS_URL);if(!window.Hands)throw new Error('MediaPipe Hands 加载失败，请检查 CDN 网络连接。');const hands=new Hands({locateFile:file=>HANDS_CDN+file});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.62,minTrackingConfidence:.58});hands.onResults(onHandResults);mpHands=hands;cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});const video=$('video');video.srcObject=cameraStream;await video.play();video.classList.add('ready');$('camIndicator').textContent='TRACKING';$('camIndicator').classList.add('on');$('liveDot').classList.add('live');$('topStatus').textContent='CAMERA / LIVE';$('cameraBtn').textContent='关闭摄像头';$('cameraBtn').classList.add('active');$('modeHint').textContent='只追踪一只手 · 握拳聚成心，张掌引发星尘爆发';btn.disabled=false;detectLoop();}catch(err){console.error(err);if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}btn.disabled=false;btn.textContent='开启摄像头';$('topStatus').textContent='SYSTEM STANDBY';if(err.name==='NotAllowedError'||err.name==='SecurityError')sayError('摄像头权限被拒绝：请在浏览器站点设置中允许摄像头后重试。');else if(err.name==='NotFoundError')sayError('没有找到可用摄像头。');else sayError(err.message||'摄像头启动失败，请检查网络和设备。')}}
async function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}$('video').srcObject=null;$('video').classList.remove('ready');$('camIndicator').textContent='OFFLINE';$('camIndicator').classList.remove('on');$('liveDot').classList.remove('live');$('topStatus').textContent='SYSTEM STANDBY';$('cameraBtn').textContent='开启摄像头';$('cameraBtn').classList.remove('active');handMode='none';handLandmarks=null;drawHand(null);setMode('galaxy')}
async function detectLoop(){if(!cameraStream||!mpHands)return;if(!detectionBusy&&$('video').readyState>=2){detectionBusy=true;try{await mpHands.send({image:$('video')})}catch(err){console.warn('Hands frame skipped',err)}finally{detectionBusy=false}}if(cameraStream)requestAnimationFrame(detectLoop)}
$('cameraBtn').addEventListener('click',()=>cameraStream?stopCamera():startCamera());$('mouseBtn').addEventListener('click',()=>{const b=$('mouseBtn');b.classList.toggle('active');if(b.classList.contains('active')){handPoint={...mousePoint};handMode='open';setMode('explosion');b.textContent='关闭鼠标互动';}else{handMode='none';setMode('galaxy');b.textContent='鼠标互动';}});document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='f'){handMode='fist';setMode('blackhole')}if(e.key.toLowerCase()==='o'){handMode='open';handPoint={...mousePoint};setMode('explosion')}if(e.key.toLowerCase()==='g'){handMode='none';setMode('galaxy')}});
(async()=>{try{await loadScript(THREE_URL);if(!window.THREE)throw new Error('Three.js 全局对象未就绪');initThree();$('topStatus').textContent='THREE.JS / READY';$('cameraBtn').disabled=false;}catch(err){console.error(err);$('topStatus').textContent='CDN LOAD FAILED';sayError('Three.js 加载失败。请确认网络可访问 jsDelivr 后刷新页面。')}})();
</script>
</body>
</html>
